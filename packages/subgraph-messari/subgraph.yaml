specVersion: 1.3.0
description: Messari Standardized DEX AMM (Extended) schema populated from a
  single Uniswap v3 pool contract on Base Sepolia — the house pool PitRouter
  wraps. Composed with the-pit-match on Match.poolId for cross-subgraph match +
  market analysis.
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: UniswapV3Pool
    network: base-sepolia
    source:
      address: "0x46880b404CD35c165EDdefF7421019F8dD25F4Ad"
      abi: UniswapV3Pool
      startBlock: 46200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - DexAmmProtocol
        - LiquidityPool
        - LiquidityPoolFee
        - Swap
        - Deposit
        - Withdraw
        - Account
        - LiquidityPoolDailySnapshot
        - UsageMetricsDailySnapshot
      abis:
        - name: UniswapV3Pool
          file: ./abis/UniswapV3Pool.json
      eventHandlers:
        - event: Initialize(uint160,int24)
          handler: handleInitialize
          calls:
            token0: UniswapV3Pool[event.address].token0()
            token1: UniswapV3Pool[event.address].token1()
            fee: UniswapV3Pool[event.address].fee()
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Mint(address,indexed address,indexed int24,indexed
            int24,uint128,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleBurn
      file: ./src/pool.ts
